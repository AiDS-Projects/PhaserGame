# asset_manifest.yaml — 初始化 Vite + Phaser 3 + TypeScript 脚手架
# 由美术 Agent 完整生成，覆盖 UX Agent 的初稿
# status: pending=待生产 / sourced=已从资产库获取 / generated=已AI生成
assets:
  - id: loading_spinner
    type: icon
    description: 启动加载指示 24px outline 风格
    source_hint: iconify
    status: pending
  - id: refresh
    type: icon
    description: 加载失败重试按钮图标 24px outline 风格
    source_hint: iconify
    status: pending
  - id: empty_state_placeholder
    type: illustration
    description: 空壳场景占位提示插画(可选) 320x180
    source_hint: ai_generate
    status: pending
  - id: ui_hover
    type: audio
    description: 按钮 hover 音效(预留, 本工单不接入)
    source_hint: kenney
    status: pending
  - id: ui_click
    type: audio
    description: 按钮点击音效(预留, 本工单不接入)
    source_hint: kenney
    status: pending